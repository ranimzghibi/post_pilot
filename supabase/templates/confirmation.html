<!-- Dashboard > Authentication > Emails > Confirm signup -->
<div style="font-family:-apple-system,Segoe UI,Arial,sans-serif;max-width:520px;margin:0 auto;padding:32px;color:#14161f">
  <h2 style="font-size:20px;margin:0 0 12px">Confirmez votre adresse</h2>
  <p style="font-size:15px;line-height:1.6">Bienvenue sur PostPilot. Cliquez ci-dessous pour activer votre compte.</p>
  <p style="margin:28px 0">
    <a href="{{ .SiteURL }}/api/auth/callback?token_hash={{ .TokenHash }}&type=email&next=/app" style="background:#1f4fd8;color:#fff;padding:12px 22px;border-radius:10px;text-decoration:none;font-weight:600">Activer mon compte</a>
  </p>
  <p style="font-size:12px;color:#6b7080">Si vous n'êtes pas à l'origine de cette inscription, ignorez ce message.</p>
</div>
