<!-- Dashboard > Authentication > Emails > Reset Password -->
<div style="font-family:-apple-system,Segoe UI,Arial,sans-serif;max-width:520px;margin:0 auto;padding:32px;color:#14161f">
  <h2 style="font-size:20px;margin:0 0 12px">Réinitialiser votre mot de passe</h2>
  <p style="font-size:15px;line-height:1.6">Ce lien est valable une heure.</p>
  <p style="margin:28px 0">
    <a href="{{ .SiteURL }}/api/auth/callback?token_hash={{ .TokenHash }}&type=recovery&next=/reset-password" style="background:#1f4fd8;color:#fff;padding:12px 22px;border-radius:10px;text-decoration:none;font-weight:600">Choisir un nouveau mot de passe</a>
  </p>
  <p style="font-size:12px;color:#6b7080">Si vous n'avez rien demandé, ignorez ce message : votre mot de passe reste inchangé.</p>
</div>
